global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "iot-applications"
    static_configs:
      - targets:
          - "otel-collector:8889"


  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8888"


  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq:15692"

        labels:
          namespace: "default"